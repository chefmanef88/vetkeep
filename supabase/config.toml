project_id = "vetkeep-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "https://vetkeep-liart.vercel.app"
additional_redirect_urls = ["https://vetkeep-liart.vercel.app/auth/confirm", "http://localhost:3000/auth/confirm", "vetkeep://auth/confirm"]
jwt_expiry = 900
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 900

[storage]
enabled = true
file_size_limit = "25MiB"

# S3 vector buckets are a paid feature and VetKeep stores no embeddings. The CLI
# defaults this to enabled, so `config push` asks a free-tier project to turn on
# something it cannot have and fails with a 402 — taking the file size limit
# above with it. Stated explicitly so the intent is in version control rather
# than depending on a CLI default.
[storage.vector]
enabled = false
