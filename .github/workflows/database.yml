name: Database security

# The paths are the job's real inputs, not just the migrations: this job also
# checks the committed types file, which is produced by scripts/gen-types.mjs
# and the db:types script in package.json. A change to either can break the
# check without touching supabase/ at all, and did.
#
# The two lists below are duplicated on purpose: GitHub Actions does not
# support YAML anchors, so there is no way to write them once.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/gen-types.mjs"
      - "package.json"
      - ".github/workflows/database.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/gen-types.mjs"
      - "package.json"
      - ".github/workflows/database.yml"

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db
      # Runs the project's own generator rather than a second copy of the
      # command. `db:types` filters the telemetry the CLI writes to stdout — it
      # once corrupted this file — and normalises the trailing newline. A raw
      # redirect here kept the generator's trailing blank line, so the diff
      # failed on every run while the committed file was perfectly correct.
      # Whatever the script does, this step now checks the same thing.
      #
      # No npm ci: the script shells out to `supabase` (from setup-cli above)
      # and `node` (preinstalled on the runner), so it needs no dependencies.
      - name: Verify generated database types are committed
        run: |
          npm run db:types
          git diff --exit-code -- packages/database/src/database.types.ts
