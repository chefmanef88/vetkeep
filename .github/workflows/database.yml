name: Database security

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/database.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db
      - name: Verify generated database types are committed
        run: |
          supabase gen types typescript --local > /tmp/database.types.ts
          diff -u packages/database/src/database.types.ts /tmp/database.types.ts
