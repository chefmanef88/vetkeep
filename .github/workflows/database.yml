name: Database security

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/database.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      # As in the pull_request trigger above. Without this, a change to this
      # file does not run the job it changes, and a broken check sits green
      # until the next migration happens to land.
      - ".github/workflows/database.yml"

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db
      # Runs the project's own generator rather than a second copy of the
      # command. `db:types` filters the telemetry the CLI writes to stdout — it
      # once corrupted this file — and normalises the trailing newline. A raw
      # redirect here kept the generator's trailing blank line, so the diff
      # failed on every run while the committed file was perfectly correct.
      # Whatever the script does, this step now checks the same thing.
      #
      # No npm ci: the script shells out to `supabase` (from setup-cli above)
      # and `node` (preinstalled on the runner), so it needs no dependencies.
      - name: Verify generated database types are committed
        run: |
          npm run db:types
          git diff --exit-code -- packages/database/src/database.types.ts
