name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: fixture-fixture-fixture
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: fixture-fixture-fixture
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

      # Blocks on critical only. Every current high-severity advisory sits in
      # the bundler toolchain, reachable when metro parses an image during a
      # build on a developer machine, and none of it ships to a phone. They all
      # resolve to image-size inside metro, which cannot be overridden here and
      # whose only patched release is a major version metro declares against.
      # npm's own suggested remedy is downgrading to expo 53 and React Native
      # 0.72, which would undo the SDK the project is built on.
      #
      # Revisit when Expo bumps metro past the advisory: restore high here and
      # delete the reporting step below.
      - name: Audit production dependencies
        run: npm audit --audit-level=critical

      # Non-blocking, so the highs stay visible in every run rather than being
      # silently forgotten once the gate stops failing on them.
      - name: Report high severity advisories
        if: always()
        run: npm audit --audit-level=high || true
